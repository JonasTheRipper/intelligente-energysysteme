# palaestrAI runtime config for the SHORT verification run (v0.2).
# Identical to runtime.conf.yaml but points at a FRESH sqlite store so the
# short run never clobbers _outputs/palaestrai_v02.db.
store_uri: "sqlite:///_outputs/palaestrai_v02_short.db"
executor_bus_port: 4242
logger_port: 0
public_bind: False
store_buffer_size: 1
