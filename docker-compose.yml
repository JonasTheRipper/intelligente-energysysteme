# =============================================================================
# PostGIS server for staging the SoCal wildfire CMA GIS layers.
#
#   docker compose up -d postgis        # start the database
#   docker compose run --rm gis-loader  # build raster + load grid into PostGIS
#
# The wildfire_cma.postgis module connects with the matching defaults
# (host=localhost port=5432 db=wildfire user=wildfire password=wildfire), which
# you can override via the PG* / WILDFIRE_PG_DSN environment variables.
# =============================================================================
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: socal_wildfire_postgis
    environment:
      POSTGRES_DB: wildfire
      POSTGRES_USER: wildfire
      POSTGRES_PASSWORD: wildfire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/postgis_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildfire -d wildfire"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot helper that builds the SoCal raster, loads the grid geometry, and
  # stages everything in PostGIS. Runs against the local source tree.
  gis-loader:
    image: python:3.12-slim
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PGHOST: postgis
      PGPORT: "5432"
      PGDATABASE: wildfire
      PGUSER: wildfire
      PGPASSWORD: wildfire
    working_dir: /work
    volumes:
      - ./:/work:ro
    command: >
      bash -lc "pip install --quiet psycopg2-binary numpy pandapower &&
                python -m wildfire_cma.postgis_load --raster-rows 600 --raster-cols 760"

volumes:
  pgdata:
