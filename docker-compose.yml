# =============================================================================
# Docker services for the SoCal wildfire / grid co-simulation.
#
#   docker compose up -d postgis        # PostGIS for GIS raster staging (port 5432)
#   docker compose up -d timescale      # TimescaleDB for palaestrAI store (port 5433)
#   docker compose run --rm gis-loader  # build raster + load grid into PostGIS
#
# PostGIS (port 5432) stores the CMA GIS layers; wildfire_cma.postgis connects
# with the matching defaults (host=localhost port=5432 db=wildfire user=wildfire
# password=wildfire), overridable via PG* / WILDFIRE_PG_DSN env vars.
#
# TimescaleDB (port 5433) stores palaestrAI experiment results (world_states,
# muscle_actions hypertables). The runtime YAMLs point at
# postgresql://palaestrai:socal_local@127.0.0.1:5433/palaestrai. Run
# `palaestrai -c runtime.conf.yaml database-create` after first start to
# create the schema + hypertables.
# =============================================================================
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: socal_wildfire_postgis
    environment:
      POSTGRES_DB: wildfire
      POSTGRES_USER: wildfire
      POSTGRES_PASSWORD: wildfire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/postgis_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildfire -d wildfire"]
      interval: 5s
      timeout: 5s
      retries: 10

  # palaestrAI experiment result store. TimescaleDB hypertables
  # (world_states, muscle_actions) are created automatically by
  # `palaestrai -c <conf> database-create`.
  timescale:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: socal_wildfire_timescale
    environment:
      POSTGRES_DB: palaestrai
      POSTGRES_USER: palaestrai
      POSTGRES_PASSWORD: socal_local
    ports:
      - "5433:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
      - ./data/timescale_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palaestrai -d palaestrai"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot helper that builds the SoCal raster, loads the grid geometry, and
  # stages everything in PostGIS. Runs against the local source tree.
  gis-loader:
    image: python:3.12-slim
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PGHOST: postgis
      PGPORT: "5432"
      PGDATABASE: wildfire
      PGUSER: wildfire
      PGPASSWORD: wildfire
    working_dir: /work
    volumes:
      - ./:/work:ro
    command: >
      bash -lc "pip install --quiet psycopg2-binary numpy pandapower &&
                python -m wildfire_cma.postgis_load --raster-rows 600 --raster-cols 760"

volumes:
  pgdata:
  tsdata:
