# GitLab CI/CD for the SoCal wildfire / grid co-simulation.
#
# Design: "light CI + manual heavy stage" (per project scope).
#   * lint     - flake8 style/error check                (fast, every push)
#   * unit     - fast unit + smoke tests, no grid/PF      (fast, every push)
#   * system   - heavy system tests: load the 5.9 MB grid, run pandapower
#                dispatch + power flow, exercise the palaestrAI env  (MANUAL)
#   * simulate - run the full NOAA MIDAS smoke + the 5-day wildfire / grid
#                co-simulation and publish the analysis as artifacts (MANUAL)
#
# The two heavy stages are `when: manual` so day-to-day pushes stay cheap; an
# engineer triggers them from the pipeline view (or they run on `main` / tags)
# when a full validation is wanted.

stages:
  - lint
  - unit
  - system
  - simulate

default:
  image: python:3.11-slim
  # Lightweight by default: numpy/scipy/pandas/pandapower/matplotlib all ship
  # manylinux wheels for cp311, so no compiler/BLAS is needed for install. The
  # heavy stages add build tooling themselves only if a source build is required.
  before_script:
    - python -V
    - python -m pip install --upgrade pip -q

cache:
  key: "${CI_JOB_NAME}"
  paths:
    - .cache/pip

variables:
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"
  PYTHONUNBUFFERED: "1"

# ---------------------------------------------------------------------------
# Stage 1 - lint  (fast, every push)
# ---------------------------------------------------------------------------
lint:
  stage: lint
  script:
    - pip install flake8 -q
    # Hard-fail only on real errors (syntax, undefined names); style is advisory.
    - flake8 wildfire_cma palaestrai_socal tests --count --select=E9,F63,F7,F82 --show-source --statistics
    - flake8 wildfire_cma palaestrai_socal tests --count --max-line-length=100 --extend-ignore=E203,W503 --exit-zero --statistics

# ---------------------------------------------------------------------------
# Stage 2 - unit + smoke  (fast, every push)
# ---------------------------------------------------------------------------
unit:
  stage: unit
  script:
    # Only the light deps are needed for the unit/smoke marker set.
    - pip install -q numpy==1.26.4 pandas==2.1.4 "scipy>=1.11,<2" "networkx>=3.0" pytest
    # The slow test modules import pandapower / palaestrai at module level, which
    # are NOT installed in this lightweight stage. Ignore those files during
    # collection so only the true unit/smoke tests are gathered and run.
    - >
      python -m pytest -m unit -v --junitxml=report-unit.xml
      --ignore=tests/test_damage_mapper.py
      --ignore=tests/test_midas_steps.py
      --ignore=tests/test_palaestrai_env.py
      --ignore=tests/test_gis_world_env.py
      --ignore=tests/test_store_render.py
  artifacts:
    when: always
    reports:
      junit: report-unit.xml
    paths:
      - report-unit.xml
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Stage 3 - system  (heavy: grid dispatch + power flow + palaestrAI env)  MANUAL
# ---------------------------------------------------------------------------
system:
  stage: system
  when: manual
  allow_failure: false
  timeout: 45m
  before_script:
    - python -V
    # runtime libs some wheels dlopen (OpenMP for numba/scipy); build tools as fallback
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential libgomp1 >/dev/null
    - python -m pip install --upgrade pip -q
  script:
    - pip install -q -r requirements.txt
    # pandapower must bypass the resolver -- see requirements-nodeps.txt
    - pip install -q --no-deps -r requirements-nodeps.txt
    # requirements.txt is runtime-only; this stage also needs the test runner.
    - pip install -q pytest
    - python -m pytest -m slow -v --junitxml=report-system.xml
  artifacts:
    when: always
    reports:
      junit: report-system.xml
    paths:
      - report-system.xml
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Stage 4a - NOAA MIDAS smoke run  (heavy)  MANUAL
# ---------------------------------------------------------------------------
midas_smoke:
  stage: simulate
  when: manual
  allow_failure: true
  timeout: 45m
  variables:
    # Without this, Python block-buffers stdout through the tee pipeline and the
    # job looks hung for minutes before dumping everything at exit.
    PYTHONUNBUFFERED: "1"
  before_script:
    - python -V
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential libgomp1 >/dev/null
    - python -m pip install --upgrade pip -q
  script:
    - pip install -q -r requirements.txt
    # pandapower must bypass the resolver -- see requirements-nodeps.txt
    - pip install -q --no-deps -r requirements-nodeps.txt
    # Prepare the MIDAS artefacts + NOAA weather CSV, then run a short scenario.
    #
    # No `|| true` / `|| echo` here any more. Both steps used to be masked, and
    # run_sim.sh sent all of its output to midas_socal/run.log, which was not an
    # artifact -- so this job reported success in 90s having silently executed
    # nothing at all and uploaded an empty _outputs/. Failures must be visible.
    - python midas_socal/prepare_midas.py
    - bash midas_socal/run_sim.sh --smoke
    - ls -la _outputs
    # An empty _outputs means the scenario did not write a store -- that is a
    # failure even if every command above happened to exit 0.
    - test -n "$(ls -A _outputs 2>/dev/null)" || { echo "ERROR: _outputs is empty, the smoke scenario produced no store output"; exit 1; }
  artifacts:
    when: always
    paths:
      - _outputs/
      - midas_socal/run.log
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Stage 4b - full 5-day wildfire / grid co-simulation + analysis  (heavy)  MANUAL
# ---------------------------------------------------------------------------
five_day_simulation:
  stage: simulate
  when: manual
  allow_failure: false
  timeout: 90m
  before_script:
    - python -V
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential libgomp1 >/dev/null
    - python -m pip install --upgrade pip -q
  script:
    - pip install -q -r requirements.txt
    # pandapower must bypass the resolver -- see requirements-nodeps.txt
    - pip install -q --no-deps -r requirements-nodeps.txt
    - python analysis/run_5day.py --max-steps 120 --outdir analysis
    # sanity-check the run produced the expected artifacts
    - test -f analysis/five_day_kpis.csv
    - test -f analysis/FIVE_DAY_ANALYSIS.md
    - test -f analysis/fire_growth.png
  artifacts:
    when: always
    paths:
      - analysis/five_day_kpis.csv
      - analysis/FIVE_DAY_ANALYSIS.md
      - analysis/*.png
    expire_in: 1 month
