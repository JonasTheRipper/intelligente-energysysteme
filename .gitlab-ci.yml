# GitLab CI/CD for the SoCal wildfire / grid co-simulation.
#
# Stages:
#   * lint     - flake8 style/error check                (fast, every push)
#   * unit     - fast unit + smoke tests, no grid/PF      (fast, every push)
#   * system   - heavy system tests: load the 5.9 MB grid, run pandapower
#                dispatch + power flow, exercise the palaestrAI env
#   * simulate - run the full NOAA MIDAS smoke + the 5-day wildfire / grid
#                co-simulation and publish the analysis as artifacts
#
# Where the jobs run:
#
#   any branch   lint + unit                     ~1 min
#   main only    + system + midas_smoke + five_day_simulation   ~13 min total
#
# Every job that runs is automatic and blocks the pipeline on failure. There are
# no manual gates.
#
# The heavy stages used to be `when: manual` to keep day-to-day pushes cheap.
# That backfired twice over: `system` had been played exactly once in the
# project's history and the two `simulate` jobs had never run at all, so the
# checks that actually validate the power flow were not really part of CI --
# and because a blocking manual job leaves the pipeline in `manual` state, no
# pipeline could ever report success on its own. Branch rules give the same
# cheap feature-branch pushes without either defect: on main the full suite runs
# by itself and a failure is a red pipeline.
#
# Measured on main: lint 19s, unit 33s, system 158s, midas_smoke 408s,
# five_day 146s.
#
# Careful with `when: manual` if you reintroduce it: a manual job with
# `allow_failure: false` blocks every later stage until someone plays it, which
# is what produced the permanently-blocked pipelines. Prefer `allow_failure:
# true` for anything genuinely optional, or a branch rule as used here.

stages:
  - lint
  - unit
  - system
  - simulate

default:
  image: python:3.11-slim
  # Lightweight by default: numpy/scipy/pandas/pandapower/matplotlib all ship
  # manylinux wheels for cp311, so no compiler/BLAS is needed for install. The
  # heavy stages add build tooling themselves only if a source build is required.
  before_script:
    - python -V
    - python -m pip install --upgrade pip -q

cache:
  key: "${CI_JOB_NAME}"
  paths:
    - .cache/pip

variables:
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"
  PYTHONUNBUFFERED: "1"

# ---------------------------------------------------------------------------
# Stage 1 - lint  (fast, every push)
# ---------------------------------------------------------------------------
lint:
  stage: lint
  script:
    - pip install flake8 -q
    # Hard-fail only on real errors (syntax, undefined names); style is advisory.
    # socal_grid, analysis and midas_socal were missing from these paths, so the
    # power-flow core itself was never linted -- an undefined name in
    # dispatch_and_run.py would only have surfaced at run time. All three pass
    # the hard gate today, so adding them costs nothing and closes the hole.
    - flake8 wildfire_cma palaestrai_socal socal_grid analysis midas_socal tests --count --select=E9,F63,F7,F82 --show-source --statistics
    - flake8 wildfire_cma palaestrai_socal socal_grid analysis midas_socal tests --count --max-line-length=100 --extend-ignore=E203,W503 --exit-zero --statistics

# ---------------------------------------------------------------------------
# Stage 2 - unit + smoke  (fast, every push)
# ---------------------------------------------------------------------------
unit:
  stage: unit
  script:
    # Only the light deps are needed for the unit/smoke marker set.
    - pip install -q numpy==1.26.4 pandas==2.1.4 "scipy>=1.11,<2" "networkx>=3.0" pytest
    # The slow test modules import pandapower / palaestrai at module level, which
    # are NOT installed in this lightweight stage. Ignore those files during
    # collection so only the true unit/smoke tests are gathered and run.
    - >
      python -m pytest -m unit -v --junitxml=report-unit.xml
      --ignore=tests/test_damage_mapper.py
      --ignore=tests/test_midas_steps.py
      --ignore=tests/test_palaestrai_env.py
      --ignore=tests/test_gis_world_env.py
      --ignore=tests/test_store_render.py
  artifacts:
    when: always
    reports:
      junit: report-unit.xml
    paths:
      - report-unit.xml
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Stage 3 - system  (heavy: grid dispatch + power flow + palaestrAI env)
# ---------------------------------------------------------------------------
system:
  stage: system
  # Heavy stage: main only. Feature branches get lint + unit (~1 min) so day-to-day
  # pushes stay cheap; the full ~13 min validation runs where it protects the
  # shared history. Note this is a *rule*, not `when: manual` -- on main the job
  # runs automatically and blocks, which is the property that was missing before.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  # On main it runs automatically and blocks. It used to be `when: manual`, and
  # in the whole history of this project it had been played exactly once -- so
  # `pytest -m slow`, the gate that actually proves the power flow is correct,
  # was effectively not part of CI. A blocking manual job also holds the entire
  # `simulate` stage behind it and keeps the pipeline in `manual` state forever,
  # which is why no pipeline was ever really green.
  allow_failure: false
  timeout: 45m
  before_script:
    - python -V
    # runtime libs some wheels dlopen (OpenMP for numba/scipy); build tools as fallback
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential libgomp1 >/dev/null
    - python -m pip install --upgrade pip -q
  script:
    - pip install -q -r requirements.txt
    # pandapower must bypass the resolver -- see requirements-nodeps.txt
    - pip install -q --no-deps -r requirements-nodeps.txt
    # requirements.txt is runtime-only; this stage also needs the test runner.
    - pip install -q pytest
    - python -m pytest -m slow -v --junitxml=report-system.xml
  artifacts:
    when: always
    reports:
      junit: report-system.xml
    paths:
      - report-system.xml
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Stage 4a - NOAA MIDAS smoke run  (heavy)
# ---------------------------------------------------------------------------
midas_smoke:
  stage: simulate
  # Heavy stage: main only. Feature branches get lint + unit (~1 min) so day-to-day
  # pushes stay cheap; the full ~13 min validation runs where it protects the
  # shared history. Note this is a *rule*, not `when: manual` -- on main the job
  # runs automatically and blocks, which is the property that was missing before.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  # Mandatory on main: runs automatically and fails the pipeline. Previously
  # `when: manual` + `allow_failure: true`, i.e. a job that had never once
  # executed and could not have failed if it had. Now that it genuinely runs
  # the co-simulation end to end (~7 min, 7200 steps) it is the only check
  # that exercises MIDAS + midas-powergrid + the scenario YAML together.
  allow_failure: false
  timeout: 45m
  variables:
    # Without this, Python block-buffers stdout through the tee pipeline and the
    # job looks hung for minutes before dumping everything at exit.
    PYTHONUNBUFFERED: "1"
  before_script:
    - python -V
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential libgomp1 >/dev/null
    - python -m pip install --upgrade pip -q
  script:
    - pip install -q -r requirements.txt
    # pandapower must bypass the resolver -- see requirements-nodeps.txt
    - pip install -q --no-deps -r requirements-nodeps.txt
    # Prepare the MIDAS artefacts + NOAA weather CSV, then run a short scenario.
    #
    # No `|| true` / `|| echo` here any more. Both steps used to be masked, and
    # run_sim.sh sent all of its output to midas_socal/run.log, which was not an
    # artifact -- so this job reported success in 90s having silently executed
    # nothing at all and uploaded an empty _outputs/. Failures must be visible.
    - python midas_socal/prepare_midas.py
    - bash midas_socal/run_sim.sh --smoke
    - ls -la _outputs
    # An empty _outputs means the scenario did not write a store -- that is a
    # failure even if every command above happened to exit 0.
    - if [ -z "$(ls -A _outputs 2>/dev/null)" ]; then echo "ERROR - _outputs is empty, the smoke scenario produced no store output"; exit 1; fi
  artifacts:
    when: always
    paths:
      - _outputs/
      - midas_socal/run.log
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Stage 4b - full 5-day wildfire / grid co-simulation + analysis  (heavy)
# ---------------------------------------------------------------------------
five_day_simulation:
  stage: simulate
  # Heavy stage: main only. Feature branches get lint + unit (~1 min) so day-to-day
  # pushes stay cheap; the full ~13 min validation runs where it protects the
  # shared history. Note this is a *rule*, not `when: manual` -- on main the job
  # runs automatically and blocks, which is the property that was missing before.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  # Also automatic on main: while any job in the pipeline is a blocking manual
  # gate, the pipeline's overall status stays `manual` and can never succeed.
  allow_failure: false
  timeout: 90m
  before_script:
    - python -V
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential libgomp1 >/dev/null
    - python -m pip install --upgrade pip -q
  script:
    - pip install -q -r requirements.txt
    # pandapower must bypass the resolver -- see requirements-nodeps.txt
    - pip install -q --no-deps -r requirements-nodeps.txt
    - python analysis/run_5day.py --max-steps 120 --outdir analysis
    # sanity-check the run produced the expected artifacts
    - test -f analysis/five_day_kpis.csv
    - test -f analysis/FIVE_DAY_ANALYSIS.md
    - test -f analysis/fire_growth.png
  artifacts:
    when: always
    paths:
      - analysis/five_day_kpis.csv
      - analysis/FIVE_DAY_ANALYSIS.md
      - analysis/*.png
    expire_in: 1 month
