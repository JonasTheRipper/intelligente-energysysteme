# =============================================================================
# EPISODE-RESET VERIFICATION -- one scripted phase, THREE episodes.
#
# Purpose: prove end-to-end (through the real palaestrAI reset broadcast, not
# just the unit tests) that the wildfire re-ignites in EVERY episode after the
# Muscle.reset() overrides. Before the fix this run burns in episode 0 only and
# episodes 1-2 are 60 steps of unburnt terrain.
#
# phase_0_no_ff is used deliberately: no firefighters, so the only thing that
# can vary between episodes is the fire itself.
#
# Run (~6 min):
#   env PYTHONPATH=$PWD .venv/bin/palaestrai -c runtime_reset_check.conf.yaml \
#     start palaestrai_socal/experiment_episode_reset_check.yml
#
# Check: analysis/ab_report.py-style per-episode burned cells must be non-zero
# for all three episodes; see tests/test_episode_reset.py for the unit guards.
# =============================================================================
uid: socal_v08_episode_reset_check
seed: 47
version: 3.5.9
schedule:
- phase_0_no_ff:
    environments:
    - environment:
        name: palaestrai_socal.gis_world_env:GisWorldEnvironment
        uid: gis_world
        params:
          raster_nrows: 130
          raster_ncols: 182
          bounds:
          - -118.1771
          - 34.1469
          - -117.9981
          - 34.2528
          use_real_dem: true
          raster_seed: 47
          env_step_min: 60.0
          max_steps: 60
          wind_speed: 8.0
          wind_dir_deg: 45.0
      state_transformer:
        name: palaestrai_socal.store_filters:StoreDumpTrimmer
        params:
          keep_suffixes:
          - gis.grid_shape
          - gis.bounds
          - gis.cell_size_m
          - gis.cell_state
          - gis.wind_field
          - gis.houses_total
          - gis.houses_burned_this_step
          - gis.houses_burned_total
          static_suffixes:
          - gis.fuel_class
          - gis.elevation_m
    - environment:
        name: palaestrai_socal.midas_grid_env:SocalMidasGridEnvironment
        uid: socal_grid
        params:
          step_size: 3600
          max_steps: 60
          end: 216000
          start_date: 2025-01-08 02:18:00+0000
          silent: true
          keep_sensors:
          - Powergrid-0.0-load-*.p_mw
          - Powergrid-0.0-bus-*.vm_pu
          - Powergrid-0.0-line-*.p_from_mw
          - Powergrid-0.Grid-0.health
          keep_actuators:
          - Powergrid-0.0-load-*.p_mw
      state_transformer:
        name: palaestrai_socal.store_filters:StoreDumpTrimmer
        params:
          keep_substrings:
          - -load-
          keep_suffixes:
          - Grid-0.health
          - .vm_pu
          - .p_from_mw
    agents:
    - name: wildfire
      brain:
        name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
        params:
          memory_size_limit: 2
      muscle:
        name: palaestrai_socal.agents.wildfire_agent:WildfireCmaMuscle
        params:
          ignition_points:
          - - -118.0935761
            - 34.1860422
          ignition_step: 1
          env_step_min: 60.0
          dt_cma_min: 5.0
          t_burn_steps: 6
          kappa: 1.5
          dead_fuel_moisture: 0.13
          wind_speed: 8.0
          wind_dir_deg: 45.0
          raster_nrows: 130
          raster_ncols: 182
          bounds:
          - -118.1771
          - 34.1469
          - -117.9981
          - 34.2528
          perimeter_path: data/perimeters/eaton_perimeter.geojson
          base_speed: 14
          boundary_gain: 0.3
          fuel_reclass: false
          containment_margin: 2
      objective:
        name: palaestrai.agent.dummy_objective:DummyObjective
        params: {}
      sensors:
      - gis_world.gis.fuel_class
      - gis_world.gis.elevation_m
      - gis_world.gis.cell_state
      actuators:
      - gis_world.gis.cell_mutations
    - name: firefighter
      brain:
        name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
        params:
          memory_size_limit: 2
      muscle:
        name: palaestrai_socal.agents.firefighter_agent:FirefighterMuscle
        params:
          n_planes: 0
          env_step_min: 60.0
          wind_speed: 8.0
          wind_dir_deg: 45.0
          raster_nrows: 130
          raster_ncols: 182
          bounds:
          - -118.1771
          - 34.1469
          - -117.9981
          - 34.2528
      objective:
        name: palaestrai_socal.agents.moo_objective:MooObjective
        params:
          alpha: 0.5
          beta: 0.5
          saidi_params:
            scale: 60.0
            base_served_mw: auto
            dt_min: 60.0
          houses_params:
            scale: 0.02
      sensors:
      - gis_world.gis.cell_state
      - gis_world.gis.fuel_class
      - gis_world.gis.houses_total
      - gis_world.gis.houses_burned_this_step
      - gis_world.gis.houses_burned_total
      - socal_grid.Powergrid-0.0-load-1664-1926.p_mw
      - socal_grid.Powergrid-0.0-load-1645-1907.p_mw
      - socal_grid.Powergrid-0.0-load-1631-1891.p_mw
      - socal_grid.Powergrid-0.0-load-1647-1909.p_mw
      - socal_grid.Powergrid-0.0-load-1644-1906.p_mw
      - socal_grid.Powergrid-0.0-load-1663-1925.p_mw
      - socal_grid.Powergrid-0.0-load-1630-1890.p_mw
      - socal_grid.Powergrid-0.0-load-1628-1888.p_mw
      - socal_grid.Powergrid-0.0-load-1649-1911.p_mw
      - socal_grid.Powergrid-0.0-load-1697-1959.p_mw
      - socal_grid.Powergrid-0.0-load-1648-1910.p_mw
      - socal_grid.Powergrid-0.0-load-1629-1889.p_mw
      - socal_grid.Powergrid-0.0-load-1625-1885.p_mw
      - socal_grid.Powergrid-0.0-load-1700-1962.p_mw
      actuators:
      - gis_world.gis.cell_mutations
    - name: damage_mapper
      brain:
        name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
        params:
          memory_size_limit: 2
      muscle:
        name: palaestrai_socal.agents.damage_agent:DamageMapperMuscle
        params:
          grid_json: midas_socal/socal_grid_midas_rescaled.json
          raster_nrows: 130
          raster_ncols: 182
          bounds:
          - -118.1771
          - 34.1469
          - -117.9981
          - 34.2528
      objective:
        name: palaestrai.agent.dummy_objective:DummyObjective
        params: {}
      sensors:
      - gis_world.gis.cell_state
      actuators:
      - socal_grid.Powergrid-0.0-load-1664-1926.p_mw
      - socal_grid.Powergrid-0.0-load-1645-1907.p_mw
      - socal_grid.Powergrid-0.0-load-1631-1891.p_mw
      - socal_grid.Powergrid-0.0-load-1647-1909.p_mw
      - socal_grid.Powergrid-0.0-load-1644-1906.p_mw
      - socal_grid.Powergrid-0.0-load-1663-1925.p_mw
      - socal_grid.Powergrid-0.0-load-1630-1890.p_mw
      - socal_grid.Powergrid-0.0-load-1628-1888.p_mw
      - socal_grid.Powergrid-0.0-load-1649-1911.p_mw
      - socal_grid.Powergrid-0.0-load-1697-1959.p_mw
      - socal_grid.Powergrid-0.0-load-1648-1910.p_mw
      - socal_grid.Powergrid-0.0-load-1629-1889.p_mw
      - socal_grid.Powergrid-0.0-load-1625-1885.p_mw
      - socal_grid.Powergrid-0.0-load-1700-1962.p_mw
    - name: grid_probe
      brain:
        name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
        params:
          memory_size_limit: 2
      muscle:
        name: palaestrai.agent.dummy_muscle:DummyMuscle
        params: {}
      objective:
        name: palaestrai.agent.dummy_objective:DummyObjective
        params: {}
      sensors:
      - socal_grid.Powergrid-0.0-bus-0.vm_pu
      - socal_grid.Powergrid-0.Grid-0.health
      actuators:
      - socal_grid.Powergrid-0.0-load-0-0.p_mw
    simulation:
      name: palaestrai.simulation.taking_turns_simulation_controller:TakingTurnsSimulationController
      conditions:
      - name: palaestrai.simulation.vanilla_simcontroller_termination_condition:VanillaSimControllerTerminationCondition
        params: {}
    phase_config:
      mode: train
      worker: 1
      episodes: 3
      evaluate_every: 1000000
run_config:
  condition:
    name: palaestrai.experiment.vanilla_rungovernor_termination_condition:VanillaRunGovernorTerminationCondition
    params: {}
