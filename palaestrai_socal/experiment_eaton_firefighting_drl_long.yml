# =============================================================================
# EATON FIRE -- v0.7 DRL firefighter LONG training run (single train phase).
#
# The full-budget counterpart of phase_4_drl_train in
# experiment_eaton_firefighting.yml: identical scenario (calibrated grid
# 130x182, real DEM, wind 8 m/s @ 45 deg, ignition Eaton Canyon, max_steps 60)
# and identical learning firefighter (FirefighterSacBrain + SaidiObjective +
# LearningFirefighterMuscle over the Box(17)/Discrete(4) contract), but with
# production SAC/CQL hyperparameters and many more episodes. The brain is
# CQL-bootstrapped from the offline teacher npz harvested from the scripted
# phases 1-3 (data/offline/eaton_teacher_all.npz), then fine-tuned online.
#
# An AgentObjectiveTerminationCondition ends the phase early once the
# firefighter's 30-episode mean objective (reward = -dSAIDI/60, <= 0) rises to
# within -0.0002 of zero -- i.e. it is reliably holding SAIDI near the
# scripted-teacher floor.
#
# Run (after user review; NOT auto-run by the coding session):
#   env PYTHONPATH=$PWD palaestrai -c runtime_pg_eaton.conf.yaml start \
#     palaestrai_socal/experiment_eaton_firefighting_drl_long.yml
# =============================================================================
uid: socal_v07_eaton_firefighting_drl_long
seed: 47
version: 3.5.9

schedule:
  - phase_drl_long_train:
      environments:
        - environment:
            name: palaestrai_socal.gis_world_env:GisWorldEnvironment
            uid: gis_world
            params:
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
              use_real_dem: true
              env_step_min: 60.0
              max_steps: 60
              wind_speed: 8.0
              wind_dir_deg: 45.0
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_suffixes:
                - gis.grid_shape
                - gis.bounds
                - gis.cell_size_m
                - gis.cell_state
                - gis.wind_field
              static_suffixes:
                - gis.fuel_class
                - gis.elevation_m
        - environment:
            name: palaestrai_socal.midas_grid_env:SocalMidasGridEnvironment
            uid: socal_grid
            params:
              step_size: 3600
              max_steps: 60
              end: 216000
              start_date: "2025-01-08 02:18:00+0000"
              silent: true
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_substrings:
                - "-load-"
              keep_suffixes:
                - Grid-0.health
                - .vm_pu
                - .p_from_mw

      agents:
        - name: wildfire
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.wildfire_agent:WildfireCmaMuscle
            params:
              ignition_points: [[-118.0935761, 34.1860422]]
              ignition_step: 1
              env_step_min: 60.0
              dt_cma_min: 5.0
              t_burn_steps: 6
              kappa: 1.5
              dead_fuel_moisture: 0.13
              wind_speed: 8.0
              wind_dir_deg: 45.0
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
              perimeter_path: data/perimeters/eaton_perimeter.geojson
              base_speed: 14
              boundary_gain: 0.3
              fuel_reclass: false
              containment_margin: 2
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.fuel_class
            - gis_world.gis.elevation_m
            - gis_world.gis.cell_state
          actuators:
            - gis_world.gis.cell_mutations

        - name: firefighter
          brain:
            name: palaestrai_socal.agents.firefighter_drl_brain:FirefighterSacBrain
            params:
              offline_npz: data/offline/eaton_teacher_all.npz
              replay_size: 1000000
              fc_dims: [256, 256]
              lr: 0.0003
              gamma: 0.99
              polyak: 0.995
              batch_size: 256
              update_after: 1000
              update_every: 50
              cql_alpha: 1.0
          muscle:
            name: palaestrai_socal.agents.firefighter_drl_agent:LearningFirefighterMuscle
            params:
              n_planes: 3
              n_helos: 2
              n_crews: 4
              n_dozers: 2
              n_engines: 3
              start_steps: 1000
              protect_assets: true
              grid_json: midas_socal/socal_grid_midas_rescaled.json
              base_served_mw: 1.0
              saidi_scale: 60.0
              env_step_min: 60.0
              max_steps: 60
              wind_speed: 8.0
              wind_dir_deg: 45.0
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
          objective:
            name: palaestrai_socal.agents.saidi_objective:SaidiObjective
            params:
              scale: 60.0
              base_served_mw: 1.0
              dt_min: 60.0
          sensors:
            - gis_world.gis.grid_shape
            - gis_world.gis.cell_size_m
            - gis_world.gis.bounds
            - gis_world.gis.cell_state
            - gis_world.gis.fuel_class
            - gis_world.gis.elevation_m
            - gis_world.gis.wind_field
            - socal_grid.Powergrid-0.0-load-1664-1926.p_mw
            - socal_grid.Powergrid-0.0-load-1645-1907.p_mw
            - socal_grid.Powergrid-0.0-load-1631-1891.p_mw
            - socal_grid.Powergrid-0.0-load-1647-1909.p_mw
            - socal_grid.Powergrid-0.0-load-1644-1906.p_mw
            - socal_grid.Powergrid-0.0-load-1663-1925.p_mw
            - socal_grid.Powergrid-0.0-load-1630-1890.p_mw
            - socal_grid.Powergrid-0.0-load-1628-1888.p_mw
            - socal_grid.Powergrid-0.0-load-1649-1911.p_mw
            - socal_grid.Powergrid-0.0-load-1697-1959.p_mw
            - socal_grid.Powergrid-0.0-load-1648-1910.p_mw
            - socal_grid.Powergrid-0.0-load-1629-1889.p_mw
            - socal_grid.Powergrid-0.0-load-1625-1885.p_mw
            - socal_grid.Powergrid-0.0-load-1700-1962.p_mw
          actuators:
            - gis_world.gis.cell_mutations

        - name: damage_mapper
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.damage_agent:DamageMapperMuscle
            params:
              grid_json: midas_socal/socal_grid_midas_rescaled.json
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.cell_state
          actuators:
            - socal_grid.Powergrid-0.0-load-1664-1926.p_mw
            - socal_grid.Powergrid-0.0-load-1645-1907.p_mw
            - socal_grid.Powergrid-0.0-load-1631-1891.p_mw
            - socal_grid.Powergrid-0.0-load-1647-1909.p_mw
            - socal_grid.Powergrid-0.0-load-1644-1906.p_mw
            - socal_grid.Powergrid-0.0-load-1663-1925.p_mw
            - socal_grid.Powergrid-0.0-load-1630-1890.p_mw
            - socal_grid.Powergrid-0.0-load-1628-1888.p_mw
            - socal_grid.Powergrid-0.0-load-1649-1911.p_mw
            - socal_grid.Powergrid-0.0-load-1697-1959.p_mw
            - socal_grid.Powergrid-0.0-load-1648-1910.p_mw
            - socal_grid.Powergrid-0.0-load-1629-1889.p_mw
            - socal_grid.Powergrid-0.0-load-1625-1885.p_mw
            - socal_grid.Powergrid-0.0-load-1700-1962.p_mw

        - name: grid_probe
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai.agent.dummy_muscle:DummyMuscle
            params: {}
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - socal_grid.Powergrid-0.0-bus-0.vm_pu
            - socal_grid.Powergrid-0.Grid-0.health
          actuators:
            - socal_grid.Powergrid-0.0-load-0-0.p_mw

      simulation:
        name: palaestrai.simulation.taking_turns_simulation_controller:TakingTurnsSimulationController
        conditions:
          - name: palaestrai.simulation.vanilla_simcontroller_termination_condition:VanillaSimControllerTerminationCondition
            params: {}

      phase_config:
        mode: train
        worker: 1
        episodes: 400
        evaluate_every: 20

run_config:
  condition:
    name: palaestrai.experiment.agent_objective_termination_condition:AgentObjectiveTerminationCondition
    params:
      firefighter:
        brain_avg30: -0.0002
