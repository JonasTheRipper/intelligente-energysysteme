# =============================================================================
# NEGATIVE CONTROL for the whitelist equivalence check.
#
# Byte-identical to experiment_whitelist_check_off.yml except raster_seed
# 47 -> 48, i.e. a different fuel/house raster and therefore a different fire.
#
# Purpose: prove analysis/compare_runs.py can SEE a difference. The OFF/OFF2
# control shows the scenario is reproducible; it does NOT show the comparator
# is sensitive -- a comparator that reads the wrong column would also report
# "ALL PHASES IDENTICAL" for every pair. This run must report DIVERGENCE FOUND.
# If it does not, the whitelist result means nothing.
# =============================================================================
# =============================================================================
# WHITELIST EQUIVALENCE CHECK -- arm A (whitelist OFF).
#
# One of three run files that together measure whether the ARL sensor whitelist
# (`keep_sensors` / `keep_actuators` on SocalMidasGridEnvironment) changes the
# simulation. Sensors are read-only reports, so by construction it cannot --
# these files turn that argument into a measurement.
#
#   experiment_whitelist_check_off.yml   arm A, no whitelist
#   experiment_whitelist_check_off2.yml  identical to A, different uid
#                                        -> the DETERMINISM CONTROL
#   experiment_whitelist_check_on.yml    arm B, whitelist active
#
# Run all three and compare with:  ./run_whitelist_check.sh
#
# Derived from experiment_eaton_firefighting_moo.yml with three changes, all
# applied identically to every arm:
#
#  1. phases 0-1 only, max_steps 8 -- this checks equivalence, not outcomes.
#  2. `grid_probe` REMOVED. Its DummyMuscle calls actuator.space.sample() on a
#     gymnasium Box seeded from OS entropy, writing a different random setpoint
#     into load-0-0.p_mw on every run. With it present, even two IDENTICAL
#     configurations diverge and no comparison is possible. (Verified: two
#     freshly built Boxes with the same parameters return different samples.)
#     It contributes only two sensors nothing reads.
#  3. raster_seed 47 is inherited from the source file, pinning the terrain.
# =============================================================================
uid: wl_check_NEG
seed: 47
version: 3.5.9

schedule:
  # ----------------------------------------------------------------------- 0
  # Phase 0 -- NO responders. Pure v0.2 baseline (zero-budget no-op identity).
  - phase_0_no_ff:
      environments:
        - environment:
            name: palaestrai_socal.gis_world_env:GisWorldEnvironment
            uid: gis_world
            params:
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
              use_real_dem: true
              # Pin the fuel/house raster across phases. A YAML `seed:` cannot do
              # this: EnvironmentConductor overwrites it with a per-phase subseed,
              # which gave the four phases four different terrains (122/108/113/132
              # house cells) and made the A/B non-comparable.
              raster_seed: 48
              env_step_min: 60.0
              max_steps: 8
              wind_speed: 8.0
              wind_dir_deg: 45.0
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_suffixes:
                - gis.grid_shape
                - gis.bounds
                - gis.cell_size_m
                - gis.cell_state
                - gis.wind_field
                - gis.houses_total
                - gis.houses_burned_this_step
                - gis.houses_burned_total
              static_suffixes:
                - gis.fuel_class
                - gis.elevation_m
        - environment:
            name: palaestrai_socal.midas_grid_env:SocalMidasGridEnvironment
            uid: socal_grid
            params:
              step_size: 3600
              max_steps: 8
              end: 28800
              start_date: "2025-01-08 02:18:00+0000"
              silent: true
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_substrings:
                - "-load-"
              keep_suffixes:
                - Grid-0.health
                - .vm_pu
                - .p_from_mw

      agents:
        - name: wildfire
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.wildfire_agent:WildfireCmaMuscle
            params:
              ignition_points: [[-118.0935761, 34.1860422]]
              ignition_step: 1
              env_step_min: 60.0
              dt_cma_min: 5.0
              t_burn_steps: 6
              kappa: 1.5
              dead_fuel_moisture: 0.13
              wind_speed: 8.0
              wind_dir_deg: 45.0
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
              perimeter_path: data/perimeters/eaton_perimeter.geojson
              base_speed: 14
              boundary_gain: 0.3
              fuel_reclass: false
              containment_margin: 2
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.fuel_class
            - gis_world.gis.elevation_m
            - gis_world.gis.cell_state
          actuators:
            - gis_world.gis.cell_mutations

        # Phase 0 firefighter: every count 0 -> zero budget -> NO mutations ->
        # fire CA is the v0.2 baseline.
        - name: firefighter
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.firefighter_agent:FirefighterMuscle
            params:
              n_planes: 0
              env_step_min: 60.0
              wind_speed: 8.0
              wind_dir_deg: 45.0
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
          objective:
            name: palaestrai_socal.agents.moo_objective:MooObjective
            params:
              alpha: 0.5
              beta: 0.5
              saidi_params:
                scale: 60.0
                base_served_mw: "auto"
                dt_min: 60.0
              houses_params:
                scale: 0.02
          sensors:
            - gis_world.gis.cell_state
            - gis_world.gis.fuel_class
            - gis_world.gis.houses_total
            - gis_world.gis.houses_burned_this_step
            - gis_world.gis.houses_burned_total
            - socal_grid.Powergrid-0.0-load-1664-1926.p_mw
            - socal_grid.Powergrid-0.0-load-1645-1907.p_mw
            - socal_grid.Powergrid-0.0-load-1631-1891.p_mw
            - socal_grid.Powergrid-0.0-load-1647-1909.p_mw
            - socal_grid.Powergrid-0.0-load-1644-1906.p_mw
            - socal_grid.Powergrid-0.0-load-1663-1925.p_mw
            - socal_grid.Powergrid-0.0-load-1630-1890.p_mw
            - socal_grid.Powergrid-0.0-load-1628-1888.p_mw
            - socal_grid.Powergrid-0.0-load-1649-1911.p_mw
            - socal_grid.Powergrid-0.0-load-1697-1959.p_mw
            - socal_grid.Powergrid-0.0-load-1648-1910.p_mw
            - socal_grid.Powergrid-0.0-load-1629-1889.p_mw
            - socal_grid.Powergrid-0.0-load-1625-1885.p_mw
            - socal_grid.Powergrid-0.0-load-1700-1962.p_mw
          actuators:
            - gis_world.gis.cell_mutations

        - name: damage_mapper
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.damage_agent:DamageMapperMuscle
            params:
              grid_json: midas_socal/socal_grid_midas_rescaled.json
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.cell_state
          actuators:
            - socal_grid.Powergrid-0.0-load-1664-1926.p_mw
            - socal_grid.Powergrid-0.0-load-1645-1907.p_mw
            - socal_grid.Powergrid-0.0-load-1631-1891.p_mw
            - socal_grid.Powergrid-0.0-load-1647-1909.p_mw
            - socal_grid.Powergrid-0.0-load-1644-1906.p_mw
            - socal_grid.Powergrid-0.0-load-1663-1925.p_mw
            - socal_grid.Powergrid-0.0-load-1630-1890.p_mw
            - socal_grid.Powergrid-0.0-load-1628-1888.p_mw
            - socal_grid.Powergrid-0.0-load-1649-1911.p_mw
            - socal_grid.Powergrid-0.0-load-1697-1959.p_mw
            - socal_grid.Powergrid-0.0-load-1648-1910.p_mw
            - socal_grid.Powergrid-0.0-load-1629-1889.p_mw
            - socal_grid.Powergrid-0.0-load-1625-1885.p_mw
            - socal_grid.Powergrid-0.0-load-1700-1962.p_mw

      simulation:
        name: palaestrai.simulation.taking_turns_simulation_controller:TakingTurnsSimulationController
        conditions:
          - name: palaestrai.simulation.vanilla_simcontroller_termination_condition:VanillaSimControllerTerminationCondition
            params: {}

      phase_config:
        mode: train
        worker: 1
        episodes: 1
        evaluate_every: 1000000

  # ----------------------------------------------------------------------- 1
  # Phase 1 -- AIR only: 3 aero tankers, indirect doctrine. Reproduces the v0.3
