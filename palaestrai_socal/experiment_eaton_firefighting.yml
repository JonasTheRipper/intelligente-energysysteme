# =============================================================================
# EATON FIRE -- v0.4 "FULL-BLOWN FIREFIGHTING" experiment (FOUR phases).
#
# Built on experiment_eaton_local_ab.yml: the SAME fine ~50 m Eaton-Canyon
# scenario, IDENTICAL seeding (seed: 47), bounds, raster (222x184), wind
# (8 m/s -> fleet NOT grounded), max_steps (60), ignition and turn order
# (wildfire -> firefighter -> damage_mapper -> grid_probe). The ONLY thing that
# changes between phases is the firefighter resource mix / doctrine:
#
#   phase 0  uid: phase_0_no_ff       no responders (pure v0.2 baseline)
#   phase 1  uid: phase_1_air         3 aero tankers, indirect line (== v0.3)
#   phase 2  uid: phase_2_air_ground  3 tankers + 4 hand crews + 2 dozers
#   phase 3  uid: phase_3_full_triage full mix + 3 engines, triage + point
#                                     protection of grid-critical ground
#
# v0.4 contracts honoured by the phasing:
#   * phase 0 firefighter has every count 0 -> zero budget -> ZERO mutations ->
#     the fire CA is bit-for-bit the v0.2 baseline (no-op identity).
#   * phase 1 is tankers-only + indirect doctrine -> reproduces the v0.3
#     retardant line EXACTLY (v0.3 identity).
#   * phases 2-3 add ground resources laying CONTAINED line (a distinct
#     cell-state, arbitrated above SUPPRESSED, below BURNED_OUT) and -- in
#     phase 3 -- engines doing point protection of grid-asset cells.
#
# The firefighter muscle is scripted (palaestrAI dummy brain + dummy objective);
# only its FirefighterMuscle is custom. It delegates to the deterministic
# IncidentCommand fleet-mix allocator (palaestrai_socal.agents.firefighting).
# Telemetry is recorded on the muscle instance and NOT returned on the
# brain/data channel (the v0.4 fix for the DummyBrain dict+int warning).
#
# The firefighter subscribes to gis.elevation_m in the ground phases so the
# muscle can derive a mean slope for crew/dozer productivity derating; if it is
# absent the muscle degrades to flat terrain (no penalty). protect_assets +
# grid_json (phase 3) let the muscle build a per-cell grid-asset value raster
# from the DamageMapper bus->cell registration for triage / point protection;
# any failure (no pandapower / grid JSON) degrades to triage-off.
#
# The grid env keeps the SAME extra sensors as the A/B file so the comparison
# grid-metrics plots are meaningful:  *-bus-*.vm_pu (vmin/vmean p.u.),
# *-line-*.p_from_mw (real intertie flow), -load-*.p_mw (served MW), health.
#
# Run (after user review; NOT auto-run by the coding session):
#   env PYTHONPATH=$PWD palaestrai -c runtime_pg_eaton.conf.yaml start \
#     palaestrai_socal/experiment_eaton_firefighting.yml
# =============================================================================
uid: socal_v04_eaton_firefighting
seed: 47
version: 3.5.9

schedule:
  # ----------------------------------------------------------------------- 0
  # Phase 0 -- NO responders. Pure v0.2 baseline (zero-budget no-op identity).
