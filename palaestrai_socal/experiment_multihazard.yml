# =============================================================================
# MULTIHAZARD experiment: the full v0.2 agent-driven SoCal wildfire x grid run.
#
# Two environments (as in M1):
#   * gis_world  -- GisWorldEnvironment (passive spatial substrate; only APPLIES
#                   the cell edits agents write, never steps the fire itself)
#   * socal_grid -- SocalMidasGridEnvironment (REAL palaestrai_mosaik + MIDAS
#                   powergrid stepping the SoCal net under mosaik)
#
# Three agents (all scripted -- DummyBrain/DummyObjective, custom Muscle only):
#   * wildfire        -- WildfireCmaMuscle: injects the ignition point(s) (an
#                        AGENT parameter, lon/lat -> row/col), advances the
#                        GUARDIAN CMA, and writes gis.cell_mutations(BURNING).
#   * damage_mapper   -- DamageMapperMuscle: reads gis.cell_state, co-registers
#                        grid buses with the raster, and sheds the load on every
#                        fire-affected bus by driving its MIDAS load p_mw
#                        actuator to 0 (load-shed trip; see damage_core.py).
#   * grid_probe      -- a DummyBrain/DummyMuscle that just samples grid health
#                        so the store also gets socal_grid world_states rows.
#
# Ignition is the wildfire agent's ``ignition_points`` param (NOT an env
# actuator / overseer action), exactly per the v0.2 design.
#
# Run (120 steps = 5 days at 60-min steps):
#   palaestrai -c runtime.conf.yaml start \
#     palaestrai_socal/experiment_multihazard.yml
#
# NB: the damage_mapper controls a representative cluster of load actuators near
# the default ignition (the buses the Eaton-like fire reaches first). The agent
# auto-discovers the bus index from each actuator uid, so widening coverage is
# purely a matter of listing more ``...load-<bus>-<idx>.p_mw`` actuators below.
# =============================================================================
uid: socal_v02_multihazard
seed: 47
version: 3.5.9

schedule:
  - phase_0_multihazard:
      environments:
        - environment:
            name: palaestrai_socal.gis_world_env:GisWorldEnvironment
            uid: gis_world
            params:
              raster_nrows: 600
              raster_ncols: 760
              use_real_dem: true
              env_step_min: 60.0
              max_steps: 120
              wind_speed: 15.0
              wind_dir_deg: 225.0
          # Trim the stored state_dump (disk fix, V02_OOM_FINDINGS.md §6): the GIS
          # env re-publishes two static nr*nc float64 grids (fuel_class,
          # elevation_m, ~37 MB/step at 600x760) every step. Keep the dynamic
          # cell_state + wind + static scalars every step, and the two big static
          # grids ONLY on the first row (store_readers rebuilds the basemap from
          # row 0). Safe for agents: see store_filters.StoreDumpTrimmer docstring.
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_suffixes:
                - gis.grid_shape
                - gis.bounds
                - gis.cell_size_m
                - gis.cell_state
                - gis.wind_field
              static_suffixes:
                - gis.fuel_class
                - gis.elevation_m
        - environment:
            name: palaestrai_socal.midas_grid_env:SocalMidasGridEnvironment
            uid: socal_grid
            params:
              step_size: 3600
              max_steps: 120
              end: 432000          # 120 steps x 3600 s
              start_date: "2025-01-07 00:00:00+0000"
              silent: true
          # Trim the stored state_dump: MIDAS publishes every bus/line/load attr
          # of the 2294-bus net each step (~16.5 MB). The store-only timelapse +
          # KPIs need only the load p_mw sensors (served-MW shortfall) plus the
          # grid_probe health/vm sensors. Keep those; drop everything else.
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_substrings:
                - "-load-"
              keep_suffixes:
                - Grid-0.health
                - bus-0.vm_pu

      agents:
        - name: wildfire
          brain:
            # CappedDummyBrain bounds the replay Memory: palaestrAI's Learner
            # appends every step's sensor_readings to Brain.memory regardless of
            # whether the brain learns, and the full-grid sensors here would
            # accumulate ~4 GB over a 120-step 600x760 run and OOM the box. See
            # palaestrai_socal/agents/capped_dummy_brain.py and V02_OOM_FINDINGS.md.
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.wildfire_agent:WildfireCmaMuscle
            params:
              ignition_points: [[-118.13, 34.19]]
              ignition_step: 1
              env_step_min: 60.0
              dt_cma_min: 5.0
              t_burn_steps: 6
              kappa: 1.5
              dead_fuel_moisture: 0.05
              wind_speed: 15.0
              wind_dir_deg: 225.0
              # static geometry as params (== gis_world config) so the agent can
              # subscribe to ONLY the equal-length grid sensors below; see
              # docs/AGENTS.md "palaestrAI flat-memory" note.
              raster_nrows: 600
              raster_ncols: 760
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          # all equal length (nr*nc) -> palaestrAI flat memory is happy.
          sensors:
            - gis_world.gis.fuel_class
            - gis_world.gis.elevation_m
            - gis_world.gis.cell_state
          actuators:
            - gis_world.gis.cell_mutations

        - name: damage_mapper
          brain:
            # CappedDummyBrain bounds the replay Memory: palaestrAI's Learner
            # appends every step's sensor_readings to Brain.memory regardless of
            # whether the brain learns, and the full-grid sensors here would
            # accumulate ~4 GB over a 120-step 600x760 run and OOM the box. See
            # palaestrai_socal/agents/capped_dummy_brain.py and V02_OOM_FINDINGS.md.
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.damage_agent:DamageMapperMuscle
            params:
              grid_json: midas_socal/socal_grid_midas_rescaled.json
              # grid_shape/bounds as params (== gis_world config) so the agent
              # subscribes to ONLY gis.cell_state (single sensor, any length OK).
              raster_nrows: 600
              raster_ncols: 760
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.cell_state
          actuators:
            - socal_grid.Powergrid-0.0-load-1664-1926.p_mw
            - socal_grid.Powergrid-0.0-load-1645-1907.p_mw
            - socal_grid.Powergrid-0.0-load-1631-1891.p_mw
            - socal_grid.Powergrid-0.0-load-1647-1909.p_mw
            - socal_grid.Powergrid-0.0-load-1644-1906.p_mw
            - socal_grid.Powergrid-0.0-load-1663-1925.p_mw
            - socal_grid.Powergrid-0.0-load-1630-1890.p_mw
            - socal_grid.Powergrid-0.0-load-1628-1888.p_mw
            - socal_grid.Powergrid-0.0-load-1649-1911.p_mw
            - socal_grid.Powergrid-0.0-load-1697-1959.p_mw
            - socal_grid.Powergrid-0.0-load-1648-1910.p_mw
            - socal_grid.Powergrid-0.0-load-1629-1889.p_mw
            - socal_grid.Powergrid-0.0-load-1625-1885.p_mw
            - socal_grid.Powergrid-0.0-load-1700-1962.p_mw

        - name: grid_probe
          brain:
            # CappedDummyBrain bounds the replay Memory: palaestrAI's Learner
            # appends every step's sensor_readings to Brain.memory regardless of
            # whether the brain learns, and the full-grid sensors here would
            # accumulate ~4 GB over a 120-step 600x760 run and OOM the box. See
            # palaestrai_socal/agents/capped_dummy_brain.py and V02_OOM_FINDINGS.md.
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai.agent.dummy_muscle:DummyMuscle
            params: {}
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - socal_grid.Powergrid-0.0-bus-0.vm_pu
            - socal_grid.Powergrid-0.Grid-0.health
          actuators:
            - socal_grid.Powergrid-0.0-load-0-0.p_mw

      simulation:
        name: palaestrai.simulation.taking_turns_simulation_controller:TakingTurnsSimulationController
        conditions:
          - name: palaestrai.simulation.vanilla_simcontroller_termination_condition:VanillaSimControllerTerminationCondition
            params: {}

      phase_config:
        mode: train
        worker: 1
        episodes: 1
        # see experiment_m1_smoke.yml: must be > 0 and large so episodes //
        # evaluate_every == 0 (no extra eval episodes, no ZeroDivisionError).
        evaluate_every: 1000000

run_config:
  condition:
    name: palaestrai.experiment.vanilla_rungovernor_termination_condition:VanillaRunGovernorTerminationCondition
    params: {}
