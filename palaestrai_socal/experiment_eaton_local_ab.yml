# =============================================================================
# EATON FIRE -- LOCAL FINE-GRID A/B experiment (v0.3 firefighter, TWO phases).
#
# This is the *sibling* of experiment_eaton_local.yml. It runs the SAME fine
# ~50 m Eaton-Canyon scenario TWICE in ONE experiment, into ONE store, with
# IDENTICAL seeding (seed: 47) so the only difference between the two phases is
# the number of aero tankers:
#
#   phase 0  uid: phase_0_no_ff      firefighter n_planes: 0  (pure baseline)
#   phase 1  uid: phase_1_with_ff    firefighter n_planes: 3  (with firefighters)
#   phase 2  uid: phase_2_with_ff7   firefighter n_planes: 7  (larger fleet)
#
# Everything else -- bounds, raster, wind (8 m/s, fleet NOT grounded), max_steps
# (60), ignition, turn order (wildfire -> firefighter -> damage_mapper ->
# grid_probe) -- is byte-identical between the phases, so this is a clean A/B.
# Phase A's firefighter has n_planes: 0, so it emits ZERO suppression mutations
# and the fire CA is bit-for-bit the v0.2 baseline; phase B lays a real line.
#
# palaestrAI tags every world_states row with its phase via
# environments.experiment_run_phase_id -> experiment_run_phases.uid/.number
# (see palaestrai/store/database_model.py). analysis/store_readers.read_run
# reads a single phase by passing phase_uid="phase_0_no_ff" /
# "phase_1_with_ff" (or phase_index=0 / 1).
#
# The grid env keeps MORE sensors than the single-phase file so the comparison
# grid-metrics plots are meaningful:
#   * every  *-bus-*.vm_pu  (min & mean bus voltage p.u. across the net)
#   * every  *-line-*.p_from_mw  (real line real-power flow -> intertie metric;
#     if the MIDAS powergrid does not expose these the reader falls back to a
#     clearly-labelled served-load proxy -- see analysis/store_readers.py)
#   * the load  -load-*.p_mw  (served MW) and Grid-0.health, as before.
# These are scalars (~5 k/step) -- negligible next to the 16 MB/step full dump
# the StoreDumpTrimmer exists to avoid.
#
# Run (after user review; NOT auto-run by the coding session):
#   env PYTHONPATH=$PWD palaestrai -c runtime_pg_eaton.conf.yaml start \
#     palaestrai_socal/experiment_eaton_local_ab.yml
# =============================================================================
uid: socal_v03_eaton_local_ab
seed: 47
version: 3.5.9

schedule:
  # ----------------------------------------------------------------------- A
  # Phase 0 -- NO firefighters (n_planes: 0). Pure v0.2 baseline.
  - phase_0_no_ff:
      environments:
        - environment:
            name: palaestrai_socal.gis_world_env:GisWorldEnvironment
            uid: gis_world
            params:
              raster_nrows: 222
              raster_ncols: 184
              bounds: [-118.14358, 34.13604, -118.04358, 34.23604]
              use_real_dem: true
              env_step_min: 60.0
              max_steps: 60
              wind_speed: 8.0
              wind_dir_deg: 45.0
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_suffixes:
                - gis.grid_shape
                - gis.bounds
                - gis.cell_size_m
                - gis.cell_state
                - gis.wind_field
              static_suffixes:
                - gis.fuel_class
                - gis.elevation_m
        - environment:
            name: palaestrai_socal.midas_grid_env:SocalMidasGridEnvironment
            uid: socal_grid
            params:
              step_size: 3600
              max_steps: 60
              end: 216000          # 60 steps x 3600 s
              start_date: "2025-01-08 02:18:00+0000"
              silent: true
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_substrings:
                - "-load-"
              keep_suffixes:
                - Grid-0.health
                - .vm_pu          # all bus voltages -> vmin_pu / vmean_pu
                - .p_from_mw      # all line flows  -> intertie_mw (real)

      agents:
        - name: wildfire
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.wildfire_agent:WildfireCmaMuscle
            params:
              ignition_points: [[-118.09358, 34.18604]]
              ignition_step: 1
              env_step_min: 60.0
              dt_cma_min: 5.0
              t_burn_steps: 6
              kappa: 1.5
              dead_fuel_moisture: 0.05
              wind_speed: 8.0
              wind_dir_deg: 45.0
              raster_nrows: 222
              raster_ncols: 184
              bounds: [-118.14358, 34.13604, -118.04358, 34.23604]
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.fuel_class
            - gis_world.gis.elevation_m
            - gis_world.gis.cell_state
          actuators:
            - gis_world.gis.cell_mutations

        # Phase A firefighter: n_planes: 0 -> zero budget -> NO suppression
        # mutations -> fire CA is the v0.2 baseline.
        - name: firefighter
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.firefighter_agent:FirefighterMuscle
            params:
              n_planes: 0
              env_step_min: 60.0
              wind_speed: 8.0
              wind_dir_deg: 45.0
              raster_nrows: 222
              raster_ncols: 184
              bounds: [-118.14358, 34.13604, -118.04358, 34.23604]
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.cell_state
            - gis_world.gis.fuel_class
          actuators:
            - gis_world.gis.cell_mutations

        - name: damage_mapper
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.damage_agent:DamageMapperMuscle
            params:
              grid_json: midas_socal/socal_grid_midas_rescaled.json
              raster_nrows: 222
              raster_ncols: 184
              bounds: [-118.14358, 34.13604, -118.04358, 34.23604]
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.cell_state
          actuators:
            - socal_grid.Powergrid-0.0-load-1664-1926.p_mw
            - socal_grid.Powergrid-0.0-load-1645-1907.p_mw
            - socal_grid.Powergrid-0.0-load-1631-1891.p_mw
            - socal_grid.Powergrid-0.0-load-1647-1909.p_mw
            - socal_grid.Powergrid-0.0-load-1644-1906.p_mw
            - socal_grid.Powergrid-0.0-load-1663-1925.p_mw
            - socal_grid.Powergrid-0.0-load-1630-1890.p_mw
            - socal_grid.Powergrid-0.0-load-1628-1888.p_mw
            - socal_grid.Powergrid-0.0-load-1649-1911.p_mw
            - socal_grid.Powergrid-0.0-load-1697-1959.p_mw
            - socal_grid.Powergrid-0.0-load-1648-1910.p_mw
            - socal_grid.Powergrid-0.0-load-1629-1889.p_mw
            - socal_grid.Powergrid-0.0-load-1625-1885.p_mw
            - socal_grid.Powergrid-0.0-load-1700-1962.p_mw

        - name: grid_probe
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai.agent.dummy_muscle:DummyMuscle
            params: {}
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - socal_grid.Powergrid-0.0-bus-0.vm_pu
            - socal_grid.Powergrid-0.Grid-0.health
          actuators:
            - socal_grid.Powergrid-0.0-load-0-0.p_mw

      simulation:
        name: palaestrai.simulation.taking_turns_simulation_controller:TakingTurnsSimulationController
        conditions:
          - name: palaestrai.simulation.vanilla_simcontroller_termination_condition:VanillaSimControllerTerminationCondition
            params: {}

      phase_config:
        mode: train
        worker: 1
        episodes: 1
        evaluate_every: 1000000

