            params:
              n_planes: 3
              n_crews: 4
              n_dozers: 2
              n_engines: 3
              doctrine: auto
              protect_assets: true
              grid_json: midas_socal/socal_grid_midas_rescaled.json
              env_step_min: 60.0
              wind_speed: 8.0
              wind_dir_deg: 45.0
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
          objective:
