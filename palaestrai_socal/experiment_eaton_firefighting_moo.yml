# =============================================================================
# EATON FIRE -- MULTI-OBJECTIVE SCORING VALIDATION (four scripted phases).
#
# WHAT THIS FILE IS FOR
# ---------------------
# A copy of experiment_eaton_firefighting.yml with the firefighter's objective
# swapped from DummyObjective to MooObjective. It exists to answer one
# question: **does the multi-objective reward score known-different policies in
# a sensible order?**
#
# It is a scoring experiment, not a learning one. The scripted FirefighterMuscle
# ignores brain feedback entirely (`update()` is `pass`) and CappedDummyBrain
# never trains, so changing the objective is BEHAVIOUR-NEUTRAL: all four phases
# produce byte-identical trajectories to the scripted A/B run, and every
# difference in the recorded objective is attributable to the scoring alone.
# That makes this a clean bench for a reward function -- four policies with
# known, different outcomes (SAIDI 1.97 -> 0.27; 137 -> 365 -> 654 acres saved),
# identical machinery, the objective as a pure observer.
#
#   phase 0  phase_0_no_ff        no responders (pure v0.2 baseline)
#   phase 1  phase_1_air          3 aero tankers, indirect line (== v0.3)
#   phase 2  phase_2_air_ground   3 tankers + 4 hand crews + 2 dozers
#   phase 3  phase_3_full_triage  full mix + 3 engines, triage + point
#                                 protection of grid-critical ground
#
# TWO DELIBERATE DIFFERENCES FROM experiment_eaton_firefighting.yml
# -----------------------------------------------------------------
# 1. **The DRL phases are removed.** MooObjective must NOT drive the SAC/CQL
#    firefighter yet: data/offline/*.npz holds pure-SAIDI rewards, so
#    bootstrapping would train the critic on two different reward functions.
#    (Separately, `_ensure_value_raster` still weights only by bus load, so a
#    learning agent has almost no lever on the house axis -- see the design
#    notes.) Re-harvest the offline buffer with matching rewards before
#    pointing a learner at this objective.
#
# 2. **The scripted firefighter now subscribes to the 14 grid-load sensors.**
#    It did not before, because its tactics do not need them -- but
#    SaidiObjective recovers served MW by summing `*-load-*.p_mw` out of the
#    agent's own Memory, so without them the SAIDI axis returns 0.0 on every
#    step and MooObjective silently degrades to a houses-only objective. The
#    muscle looks its sensors up by suffix and ignores the rest, so the extra
#    subscription does not change behaviour.
#
# `base_served_mw: 241.5` is the combined nameplate load of exactly those 14
# sensors. The SaidiObjective default of 1.0 suits a normalised testbed grid;
# against a 241.5 MW subscription it makes `clip(base - served, 0, base)`
# identically zero -- the same silent-zero failure as above, by a different
# route. If a run shows the SAIDI axis contributing nothing, check this number
# first (MooObjective.running_shares() reports the per-axis split).
#
# Run (heavy; ~30-45 min, ~5 GB RAM peak, phases sequential):
#   env PYTHONPATH=$PWD palaestrai -c runtime.conf.yaml start \
#     palaestrai_socal/experiment_eaton_firefighting_moo.yml
#
# Evaluate: analysis.store_readers.read_agent_objectives(store, "firefighter",
# phase_uid=...) gives the per-step objective trace per phase; compare the
# cumulative totals across the four phases and check the ranking matches
# domain judgement.
# =============================================================================
uid: socal_v08_eaton_firefighting_moo
seed: 47
version: 3.5.9

schedule:
  # ----------------------------------------------------------------------- 0
  # Phase 0 -- NO responders. Pure v0.2 baseline (zero-budget no-op identity).
  - phase_0_no_ff:
      environments:
        - environment:
            name: palaestrai_socal.gis_world_env:GisWorldEnvironment
            uid: gis_world
            params:
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
              use_real_dem: true
              env_step_min: 60.0
              max_steps: 60
              wind_speed: 8.0
              wind_dir_deg: 45.0
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_suffixes:
                - gis.grid_shape
                - gis.bounds
                - gis.cell_size_m
                - gis.cell_state
                - gis.wind_field
                - gis.houses_total
                - gis.houses_burned_this_step
                - gis.houses_burned_total
              static_suffixes:
                - gis.fuel_class
                - gis.elevation_m
        - environment:
            name: palaestrai_socal.midas_grid_env:SocalMidasGridEnvironment
            uid: socal_grid
            params:
              step_size: 3600
              max_steps: 60
              end: 216000
              start_date: "2025-01-08 02:18:00+0000"
              silent: true
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_substrings:
                - "-load-"
              keep_suffixes:
                - Grid-0.health
                - .vm_pu
                - .p_from_mw

      agents:
        - name: wildfire
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.wildfire_agent:WildfireCmaMuscle
            params:
              ignition_points: [[-118.0935761, 34.1860422]]
              ignition_step: 1
              env_step_min: 60.0
              dt_cma_min: 5.0
              t_burn_steps: 6
              kappa: 1.5
              dead_fuel_moisture: 0.13
              wind_speed: 8.0
              wind_dir_deg: 45.0
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
              perimeter_path: data/perimeters/eaton_perimeter.geojson
              base_speed: 14
              boundary_gain: 0.3
              fuel_reclass: false
              containment_margin: 2
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.fuel_class
            - gis_world.gis.elevation_m
            - gis_world.gis.cell_state
          actuators:
            - gis_world.gis.cell_mutations

        # Phase 0 firefighter: every count 0 -> zero budget -> NO mutations ->
        # fire CA is the v0.2 baseline.
        - name: firefighter
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.firefighter_agent:FirefighterMuscle
            params:
              n_planes: 0
              env_step_min: 60.0
              wind_speed: 8.0
              wind_dir_deg: 45.0
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
          objective:
            name: palaestrai_socal.agents.moo_objective:MooObjective
            params:
              alpha: 0.5
              beta: 0.5
              saidi_params:
                scale: 60.0
                base_served_mw: 241.5
                dt_min: 60.0
              houses_params:
                scale: 0.02
          sensors:
            - gis_world.gis.cell_state
            - gis_world.gis.fuel_class
            - gis_world.gis.houses_total
            - gis_world.gis.houses_burned_this_step
            - gis_world.gis.houses_burned_total
            - socal_grid.Powergrid-0.0-load-1664-1926.p_mw
            - socal_grid.Powergrid-0.0-load-1645-1907.p_mw
            - socal_grid.Powergrid-0.0-load-1631-1891.p_mw
            - socal_grid.Powergrid-0.0-load-1647-1909.p_mw
            - socal_grid.Powergrid-0.0-load-1644-1906.p_mw
            - socal_grid.Powergrid-0.0-load-1663-1925.p_mw
            - socal_grid.Powergrid-0.0-load-1630-1890.p_mw
            - socal_grid.Powergrid-0.0-load-1628-1888.p_mw
            - socal_grid.Powergrid-0.0-load-1649-1911.p_mw
