  # ----------------------------------------------------------------------- 4
  # Phase 4 -- DRL TRAIN. A LEARNING firefighter replaces the scripted one: the
  # hARL SAC/CQL brain (FirefighterSacBrain) is bootstrapped from the offline
  # teacher transitions harvested from THIS store's phases 1-3
  # (data/offline/eaton_teacher_all.npz), then fine-tuned online. The learning
  # muscle (LearningFirefighterMuscle) presents the 17-dim contract observation
  # and maps the policy's Discrete(4) doctrine onto the SAME IncidentCommand
  # machinery the scripted teacher used, so physical suppression stays
  # consistent. Fleet == phase 3 (full mix + engines) so every doctrine (incl.
  # triage) is executable. Objective = SaidiObjective (reward = -dSAIDI/60).
run_config:
  condition:
    name: palaestrai.experiment.vanilla_rungovernor_termination_condition:VanillaRunGovernorTerminationCondition
    params: {}
