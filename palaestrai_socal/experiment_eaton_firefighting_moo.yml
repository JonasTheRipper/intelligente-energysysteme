  # ----------------------------------------------------------------------- 3
  # Phase 3 -- FULL MIX + TRIAGE: 3 tankers + 4 crews + 2 dozers + 3 engines,
  # protect_assets on. Engines do point protection of grid-critical ground;
  # the muscle builds a per-cell value raster from the DamageMapper bus->cell
  # registration (needs the grid JSON + pandapower; degrades to triage-off).
  - phase_3_full_triage:
      environments:
        - environment:
            name: palaestrai_socal.gis_world_env:GisWorldEnvironment
            uid: gis_world
            params:
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
              use_real_dem: true
              env_step_min: 60.0
              max_steps: 60
              wind_speed: 8.0
              wind_dir_deg: 45.0
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_suffixes:
                - gis.grid_shape
                - gis.bounds
                - gis.cell_size_m
                - gis.cell_state
                - gis.wind_field
                - gis.houses_total
                - gis.houses_burned_this_step
                - gis.houses_burned_total
              static_suffixes:
                - gis.fuel_class
                - gis.elevation_m
        - environment:
            name: palaestrai_socal.midas_grid_env:SocalMidasGridEnvironment
            uid: socal_grid
            params:
              step_size: 3600
              max_steps: 60
              end: 216000
              start_date: "2025-01-08 02:18:00+0000"
              silent: true
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_substrings:
                - "-load-"
              keep_suffixes:
                - Grid-0.health
                - .vm_pu
                - .p_from_mw

      agents:
        - name: wildfire
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.wildfire_agent:WildfireCmaMuscle
            params:
              ignition_points: [[-118.0935761, 34.1860422]]
              ignition_step: 1
              env_step_min: 60.0
              dt_cma_min: 5.0
              t_burn_steps: 6
              kappa: 1.5
              dead_fuel_moisture: 0.13
              wind_speed: 8.0
              wind_dir_deg: 45.0
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
              perimeter_path: data/perimeters/eaton_perimeter.geojson
              base_speed: 14
              boundary_gain: 0.3
              fuel_reclass: false
              containment_margin: 2
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.fuel_class
            - gis_world.gis.elevation_m
            - gis_world.gis.cell_state
          actuators:
            - gis_world.gis.cell_mutations

        # Phase 3 firefighter: full mix + engines, triage / point protection on.
