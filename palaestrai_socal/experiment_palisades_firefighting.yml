# =============================================================================
# PALISADES FIRE -- v0.5 "FULL-BLOWN FIREFIGHTING" experiment (FOUR phases).
#
# Structure mirrors experiment_eaton_firefighting.yml.  Changes from Eaton:
#   - Palisades perimeter & ignition (Skull Rock / Temescal Ridge Trail)
#   - Calibrated grid: raster 159x219, bounds (-118.7009, 34.0148, -118.4856,
#     34.1444) = pad=0.015 around perimeter bbox
#   - Spatial wind: base_speed=16, boundary_gain=0.6
#   - Fuel reclassification ON (fuel_reclass: true) — the official perimeter
#     certifies that ~13% urban/coastal cells inside the footprint burned;
#     they are reclassified from class 0 to class 3 (chaparral) before the CA.
#   - dead_fuel_moisture: 0.08 (extreme Santa Ana / dry-season Palisades fuel)
#   - MIDAS grid: reuses rescaled SoCal MIDAS grid remapped to Palisades
#     footprint (palisades_grid_midas_rescaled.json — copy of the SoCal
#     rescaled grid, ILLUSTRATIVE, NOT a real LADWP feeder)
#
# Four phases:
#   phase 0  uid: phase_0_no_ff       no responders (pure v0.2 baseline)
#   phase 1  uid: phase_1_air         3 aero tankers, indirect line (== v0.3)
#   phase 2  uid: phase_2_air_ground  3 tankers + 4 hand crews + 2 dozers
#   phase 3  uid: phase_3_full_triage full mix + 3 engines, triage + point
#                                     protection of grid-critical ground
#
# Run (after user review; NOT auto-run by the coding session):
#   env PYTHONPATH=$PWD palaestrai -c runtime_pg_eaton.conf.yaml start \
#     palaestrai_socal/experiment_palisades_firefighting.yml
# =============================================================================
uid: socal_v05_palisades_firefighting
seed: 47
version: 3.5.9

schedule:
  # ----------------------------------------------------------------------- 0
  # Phase 0 -- NO responders. Pure v0.2 baseline (zero-budget no-op identity).
  - phase_0_no_ff:
      environments:
        - environment:
            name: palaestrai_socal.gis_world_env:GisWorldEnvironment
            uid: gis_world
            params:
              raster_nrows: 159
              raster_ncols: 219
              bounds: [-118.7009, 34.0148, -118.4856, 34.1444]
              use_real_dem: true
              env_step_min: 60.0
              max_steps: 60
              wind_speed: 8.0
              wind_dir_deg: 270.0
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_suffixes:
                - gis.grid_shape
                - gis.bounds
                - gis.cell_size_m
                - gis.cell_state
                - gis.wind_field
              static_suffixes:
                - gis.fuel_class
                - gis.elevation_m
        - environment:
            name: palaestrai_socal.midas_grid_env:SocalMidasGridEnvironment
            uid: socal_grid
            params:
              step_size: 3600
              max_steps: 60
              end: 216000
              start_date: "2025-01-07 14:30:00+0000"
              silent: true
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_substrings:
                - "-load-"
              keep_suffixes:
                - Grid-0.health
                - .vm_pu
                - .p_from_mw

      agents:
        - name: wildfire
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.wildfire_agent:WildfireCmaMuscle
            params:
              ignition_points: [[-118.5426, 34.0781]]
              ignition_step: 1
              env_step_min: 60.0
              dt_cma_min: 5.0
              t_burn_steps: 6
              kappa: 1.5
              dead_fuel_moisture: 0.08
              wind_speed: 8.0
              wind_dir_deg: 270.0
              raster_nrows: 159
              raster_ncols: 219
              bounds: [-118.7009, 34.0148, -118.4856, 34.1444]
              perimeter_path: data/perimeters/palisades_perimeter.geojson
              base_speed: 16
              boundary_gain: 0.6
              fuel_reclass: true
              containment_margin: 2
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.fuel_class
            - gis_world.gis.elevation_m
            - gis_world.gis.cell_state
          actuators:
            - gis_world.gis.cell_mutations

        # Phase 0 firefighter: every count 0 -> zero budget -> NO mutations ->
        # fire CA is the v0.2 baseline.
        - name: firefighter
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.firefighter_agent:FirefighterMuscle
            params:
              n_planes: 0
              env_step_min: 60.0
              wind_speed: 8.0
              wind_dir_deg: 270.0
              raster_nrows: 159
              raster_ncols: 219
              bounds: [-118.7009, 34.0148, -118.4856, 34.1444]
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.cell_state
            - gis_world.gis.fuel_class
          actuators:
            - gis_world.gis.cell_mutations

        - name: damage_mapper
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.damage_agent:DamageMapperMuscle
            params:
              grid_json: midas_socal/palisades_grid_midas_rescaled.json
              raster_nrows: 159
              raster_ncols: 219
              bounds: [-118.7009, 34.0148, -118.4856, 34.1444]
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.cell_state
          actuators:
            - socal_grid.Powergrid-0.0-load-1664-1926.p_mw
            - socal_grid.Powergrid-0.0-load-1645-1907.p_mw
            - socal_grid.Powergrid-0.0-load-1631-1891.p_mw
            - socal_grid.Powergrid-0.0-load-1647-1909.p_mw
            - socal_grid.Powergrid-0.0-load-1644-1906.p_mw
            - socal_grid.Powergrid-0.0-load-1663-1925.p_mw
            - socal_grid.Powergrid-0.0-load-1630-1890.p_mw
            - socal_grid.Powergrid-0.0-load-1628-1888.p_mw
            - socal_grid.Powergrid-0.0-load-1649-1911.p_mw
            - socal_grid.Powergrid-0.0-load-1697-1959.p_mw
            - socal_grid.Powergrid-0.0-load-1648-1910.p_mw
            - socal_grid.Powergrid-0.0-load-1629-1889.p_mw
            - socal_grid.Powergrid-0.0-load-1625-1885.p_mw
            - socal_grid.Powergrid-0.0-load-1700-1962.p_mw

        - name: grid_probe
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai.agent.dummy_muscle:DummyMuscle
            params: {}
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - socal_grid.Powergrid-0.0-bus-0.vm_pu
            - socal_grid.Powergrid-0.Grid-0.health
          actuators:
            - socal_grid.Powergrid-0.0-load-0-0.p_mw

      simulation:
        name: palaestrai.simulation.taking_turns_simulation_controller:TakingTurnsSimulationController
        conditions:
          - name: palaestrai.simulation.vanilla_simcontroller_termination_condition:VanillaSimControllerTerminationCondition
            params: {}

      phase_config:
        mode: train
        worker: 1
        episodes: 1
        evaluate_every: 1000000

