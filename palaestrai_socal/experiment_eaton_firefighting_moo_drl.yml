            - socal_grid.Powergrid-0.0-load-0-0.p_mw

      simulation:
        name: palaestrai.simulation.taking_turns_simulation_controller:TakingTurnsSimulationController
        conditions:
          - name: palaestrai.simulation.vanilla_simcontroller_termination_condition:VanillaSimControllerTerminationCondition
            params: {}

      phase_config:
        mode: train
        worker: 1
        episodes: 20
        evaluate_every: 5

  # ----------------------------------------------------------------------- 5
  # Phase 5 -- THE CONTROL. Byte-identical to phase 4 in every respect except
  # the objective: SaidiObjective instead of MooObjective. Same environments,
  # same seed, same fleet, same SAC hyperparameters, same episode budget, and
  # neither phase is offline-bootstrapped, so the ONLY difference between the
  # two learning curves is the reward function.
  #
  # Without this phase the experiment cannot answer its own question: a
  # MOO-trained agent's SAIDI is only interpretable against a SAIDI-trained
  # agent's SAIDI on the same scenario. Phases get independent brains, so this
  # is two genuinely separate trainings in one run.
  - phase_5_drl_train_saidi_control:
      environments:
        - environment:
            name: palaestrai_socal.gis_world_env:GisWorldEnvironment
            uid: gis_world
            params:
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
              use_real_dem: true
              # Pin the fuel/house raster across phases. A YAML `seed:` cannot do
              # this: EnvironmentConductor overwrites it with a per-phase subseed,
              # which gave the four phases four different terrains (122/108/113/132
              # house cells) and made the A/B non-comparable.
              raster_seed: 47
              env_step_min: 60.0
              max_steps: 60
              wind_speed: 8.0
              wind_dir_deg: 45.0
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_suffixes:
                - gis.grid_shape
                - gis.bounds
                - gis.cell_size_m
                - gis.cell_state
                - gis.wind_field
                - gis.houses_total
                - gis.houses_burned_this_step
                - gis.houses_burned_total
              static_suffixes:
                - gis.fuel_class
                - gis.elevation_m
        - environment:
            name: palaestrai_socal.midas_grid_env:SocalMidasGridEnvironment
            uid: socal_grid
            params:
              step_size: 3600
              max_steps: 60
              end: 216000
              start_date: "2025-01-08 02:18:00+0000"
              silent: true
              keep_sensors:
                - "Powergrid-0.0-load-*.p_mw"
                - "Powergrid-0.0-bus-*.vm_pu"
                - "Powergrid-0.0-line-*.p_from_mw"
                - "Powergrid-0.Grid-0.health"
              keep_actuators:
                - "Powergrid-0.0-load-*.p_mw"
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_substrings:
                - "-load-"
              keep_suffixes:
                - Grid-0.health
                - .vm_pu
                - .p_from_mw

      agents:
        - name: wildfire
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: { memory_size_limit: 2 }
          muscle:
            name: palaestrai_socal.agents.wildfire_agent:WildfireCmaMuscle
            params:
              ignition_points: [[-118.0935761, 34.1860422]]
              ignition_step: 1
              env_step_min: 60.0
              dt_cma_min: 5.0
              t_burn_steps: 6
              kappa: 1.5
              dead_fuel_moisture: 0.13
              wind_speed: 8.0
              wind_dir_deg: 45.0
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
              perimeter_path: data/perimeters/eaton_perimeter.geojson
              base_speed: 14
              boundary_gain: 0.3
              fuel_reclass: false
              containment_margin: 2
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.fuel_class
            - gis_world.gis.elevation_m
            - gis_world.gis.cell_state
          actuators:
            - gis_world.gis.cell_mutations

        # Phase 3 firefighter: full mix + engines, triage / point protection on.
        - name: firefighter
          brain:
            name: palaestrai_socal.agents.firefighter_drl_brain:FirefighterSacBrain
            params:
              # Bootstrapped from the SAIDI-reward buffer -- same 236
              # transitions, same states and actions as the MOO buffer, only
              # the reward column differs. Note 202/236 of its rewards are
              # exactly 0: SAIDI is non-zero only on NOOP transitions, which
              # is the degeneracy this experiment is measuring.
              offline_npz: data/offline/eaton_teacher_saidi.npz
              replay_size: 50000
              fc_dims: [256, 256]
              lr: 0.0003
              gamma: 0.99
              polyak: 0.995
              batch_size: 64
              update_after: 200
              update_every: 30
              cql_alpha: 1.0
          muscle:
            name: palaestrai_socal.agents.firefighter_drl_agent:LearningFirefighterMuscle
            params:
              n_planes: 3
              n_helos: 2
              n_crews: 4
              n_dozers: 2
              n_engines: 3
              start_steps: 200
              protect_assets: true
              grid_json: midas_socal/socal_grid_midas_rescaled.json
              # Measured, not assumed: the 14 subscribed load sensors serve
              # 232.237 MW with nothing shed (read back from a smoke run's
              # stored world_states). The old default of 1.0 pinned observation
              # feature 10 at its clip ceiling -- served/base = 232 -> clip(.,0,2)
              # = 2.0 on every step, i.e. a constant carrying no information.
              # Re-measure if the load subscription below changes.
              base_served_mw: 232.237
              saidi_scale: 60.0
              env_step_min: 60.0
              max_steps: 60
              wind_speed: 8.0
              wind_dir_deg: 45.0
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
          objective:
            name: palaestrai_socal.agents.saidi_objective:SaidiObjective
            params:
              scale: 60.0
              base_served_mw: "auto"
              dt_min: 60.0
          sensors:
            - gis_world.gis.cell_state
            - gis_world.gis.fuel_class
            - gis_world.gis.elevation_m
            - gis_world.gis.houses_total
            - gis_world.gis.houses_burned_this_step
            - gis_world.gis.houses_burned_total
            - socal_grid.Powergrid-0.0-load-1664-1926.p_mw
            - socal_grid.Powergrid-0.0-load-1645-1907.p_mw
            - socal_grid.Powergrid-0.0-load-1631-1891.p_mw
            - socal_grid.Powergrid-0.0-load-1647-1909.p_mw
            - socal_grid.Powergrid-0.0-load-1644-1906.p_mw
            - socal_grid.Powergrid-0.0-load-1663-1925.p_mw
            - socal_grid.Powergrid-0.0-load-1630-1890.p_mw
            - socal_grid.Powergrid-0.0-load-1628-1888.p_mw
            - socal_grid.Powergrid-0.0-load-1649-1911.p_mw
            - socal_grid.Powergrid-0.0-load-1697-1959.p_mw
            - socal_grid.Powergrid-0.0-load-1648-1910.p_mw
            - socal_grid.Powergrid-0.0-load-1629-1889.p_mw
            - socal_grid.Powergrid-0.0-load-1625-1885.p_mw
            - socal_grid.Powergrid-0.0-load-1700-1962.p_mw
          actuators:
            - gis_world.gis.cell_mutations
        - name: damage_mapper
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {}
          muscle:
            name: palaestrai_socal.agents.damage_agent:DamageMapperMuscle
            params:
              grid_json: midas_socal/socal_grid_midas_rescaled.json
              raster_nrows: 130
              raster_ncols: 182
              bounds: [-118.1771, 34.1469, -117.9981, 34.2528]
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.cell_state
          actuators:
            - socal_grid.Powergrid-0.0-load-1664-1926.p_mw
            - socal_grid.Powergrid-0.0-load-1645-1907.p_mw
            - socal_grid.Powergrid-0.0-load-1631-1891.p_mw
            - socal_grid.Powergrid-0.0-load-1647-1909.p_mw
            - socal_grid.Powergrid-0.0-load-1644-1906.p_mw
            - socal_grid.Powergrid-0.0-load-1663-1925.p_mw
            - socal_grid.Powergrid-0.0-load-1630-1890.p_mw
            - socal_grid.Powergrid-0.0-load-1628-1888.p_mw
            - socal_grid.Powergrid-0.0-load-1649-1911.p_mw
            - socal_grid.Powergrid-0.0-load-1697-1959.p_mw
            - socal_grid.Powergrid-0.0-load-1648-1910.p_mw
            - socal_grid.Powergrid-0.0-load-1629-1889.p_mw
            - socal_grid.Powergrid-0.0-load-1625-1885.p_mw
            - socal_grid.Powergrid-0.0-load-1700-1962.p_mw

        - name: grid_probe
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: { memory_size_limit: 2 }
          muscle:
            name: palaestrai.agent.dummy_muscle:DummyMuscle
            params: {}
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - socal_grid.Powergrid-0.0-bus-0.vm_pu
            - socal_grid.Powergrid-0.Grid-0.health
          actuators:
            - socal_grid.Powergrid-0.0-load-0-0.p_mw

      simulation:
        name: palaestrai.simulation.taking_turns_simulation_controller:TakingTurnsSimulationController
        conditions:
          - name: palaestrai.simulation.vanilla_simcontroller_termination_condition:VanillaSimControllerTerminationCondition
            params: {}

      phase_config:
        mode: train
        worker: 1
        episodes: 20
        evaluate_every: 5

run_config:
  condition:
    name: palaestrai.experiment.vanilla_rungovernor_termination_condition:VanillaRunGovernorTerminationCondition
    params: {}
