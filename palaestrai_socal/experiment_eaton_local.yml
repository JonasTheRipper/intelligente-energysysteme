# =============================================================================
# EATON FIRE -- LOCAL FINE-GRID scenario (v0.3 firefighter demonstration).
#
# Same v0.2/v0.3 machinery as experiment_eaton.yml (real MIDAS/mosaik powergrid +
# GisWorldEnvironment + WildfireCmaAgent + FirefighterAgent + DamageMapperAgent),
# but on a SMALL, FINE raster around the Eaton Canyon ignition so the aero tanker
# is operationally MEANINGFUL.
#
# Why a separate scenario (design §3 caveat): on the statewide 600x760 grid one
# cell is ~947 m, so a realistic ~0.6 km retardant line is sub-cell and the
# budget rounds to 0 even in calm wind. Here a ~0.05 deg box around the ignition
# at ~50 m cells (222 x 184) makes a multi-plane line span ~100+ cells, so the
# firefighter visibly holds a line and increasing n_planes reduces burned acres.
#
# Wind is set to a MODERATE 8 m/s (below DEGRADE_WIND_MS=13) so wind_efficiency=1
# and the fleet is NOT grounded -- the opposite end of the Eaton high-wind
# baseline (experiment_eaton.yml), where 25 m/s grounds the fleet to zero drops.
#
# Run (after user review; NOT auto-run by the coding session):
#   env PYTHONPATH=$PWD palaestrai -c runtime_pg_eaton.conf.yaml start \
#     palaestrai_socal/experiment_eaton_local.yml
# =============================================================================
uid: socal_v03_eaton_local
seed: 47
version: 3.5.9

schedule:
  - phase_0_eaton_local:
      environments:
        - environment:
            name: palaestrai_socal.gis_world_env:GisWorldEnvironment
            uid: gis_world
            params:
              # ~0.05 deg box around the Eaton Canyon origin [-118.09358, 34.18604];
              # 222 x 184 cells over ~11 x 9 km -> ~50 m cells.
              raster_nrows: 222
              raster_ncols: 184
              bounds: [-118.14358, 34.13604, -118.04358, 34.23604]
              use_real_dem: true
              env_step_min: 60.0
              max_steps: 60
              wind_speed: 8.0
              wind_dir_deg: 45.0
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_suffixes:
                - gis.grid_shape
                - gis.bounds
                - gis.cell_size_m
                - gis.cell_state
                - gis.wind_field
              static_suffixes:
                - gis.fuel_class
                - gis.elevation_m
        - environment:
            name: palaestrai_socal.midas_grid_env:SocalMidasGridEnvironment
            uid: socal_grid
            params:
              step_size: 3600
              max_steps: 60
              end: 216000          # 60 steps x 3600 s
              start_date: "2025-01-08 02:18:00+0000"
              silent: true
          state_transformer:
            name: palaestrai_socal.store_filters:StoreDumpTrimmer
            params:
              keep_substrings:
                - "-load-"
              keep_suffixes:
                - Grid-0.health
                - bus-0.vm_pu

      agents:
        - name: wildfire
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.wildfire_agent:WildfireCmaMuscle
            params:
              ignition_points: [[-118.09358, 34.18604]]
              ignition_step: 1
              env_step_min: 60.0
              dt_cma_min: 5.0
              t_burn_steps: 6
              kappa: 1.5
              dead_fuel_moisture: 0.05
              wind_speed: 8.0
              wind_dir_deg: 45.0
              raster_nrows: 222
              raster_ncols: 184
              bounds: [-118.14358, 34.13604, -118.04358, 34.23604]
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.fuel_class
            - gis_world.gis.elevation_m
            - gis_world.gis.cell_state
          actuators:
            - gis_world.gis.cell_mutations

        # v0.3 aero tanker. On THIS fine grid + moderate wind the fleet is NOT
        # grounded, so n_planes drives a real retardant budget. Turn order:
        # wildfire -> firefighter -> damage_mapper. Sweep n_planes in {0,1,3,5,7}
        # with analysis/firefighter_report.py to measure acres saved vs baseline.
        - name: firefighter
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.firefighter_agent:FirefighterMuscle
            params:
              n_planes: 3
              env_step_min: 60.0
              wind_speed: 8.0
              wind_dir_deg: 45.0
              raster_nrows: 222
              raster_ncols: 184
              bounds: [-118.14358, 34.13604, -118.04358, 34.23604]
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.cell_state
            - gis_world.gis.fuel_class
          actuators:
            - gis_world.gis.cell_mutations

        - name: damage_mapper
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai_socal.agents.damage_agent:DamageMapperMuscle
            params:
              grid_json: midas_socal/socal_grid_midas_rescaled.json
              raster_nrows: 222
              raster_ncols: 184
              bounds: [-118.14358, 34.13604, -118.04358, 34.23604]
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - gis_world.gis.cell_state
          actuators:
            - socal_grid.Powergrid-0.0-load-1664-1926.p_mw
            - socal_grid.Powergrid-0.0-load-1645-1907.p_mw
            - socal_grid.Powergrid-0.0-load-1631-1891.p_mw
            - socal_grid.Powergrid-0.0-load-1647-1909.p_mw
            - socal_grid.Powergrid-0.0-load-1644-1906.p_mw
            - socal_grid.Powergrid-0.0-load-1663-1925.p_mw
            - socal_grid.Powergrid-0.0-load-1630-1890.p_mw
            - socal_grid.Powergrid-0.0-load-1628-1888.p_mw
            - socal_grid.Powergrid-0.0-load-1649-1911.p_mw
            - socal_grid.Powergrid-0.0-load-1697-1959.p_mw
            - socal_grid.Powergrid-0.0-load-1648-1910.p_mw
            - socal_grid.Powergrid-0.0-load-1629-1889.p_mw
            - socal_grid.Powergrid-0.0-load-1625-1885.p_mw
            - socal_grid.Powergrid-0.0-load-1700-1962.p_mw

        - name: grid_probe
          brain:
            name: palaestrai_socal.agents.capped_dummy_brain:CappedDummyBrain
            params: {memory_size_limit: 2}
          muscle:
            name: palaestrai.agent.dummy_muscle:DummyMuscle
            params: {}
          objective:
            name: palaestrai.agent.dummy_objective:DummyObjective
            params: {}
          sensors:
            - socal_grid.Powergrid-0.0-bus-0.vm_pu
            - socal_grid.Powergrid-0.Grid-0.health
          actuators:
            - socal_grid.Powergrid-0.0-load-0-0.p_mw

      simulation:
        name: palaestrai.simulation.taking_turns_simulation_controller:TakingTurnsSimulationController
        conditions:
          - name: palaestrai.simulation.vanilla_simcontroller_termination_condition:VanillaSimControllerTerminationCondition
            params: {}

      phase_config:
        mode: train
        worker: 1
        episodes: 1
        evaluate_every: 1000000

run_config:
  condition:
    name: palaestrai.experiment.vanilla_rungovernor_termination_condition:VanillaRunGovernorTerminationCondition
    params: {}
