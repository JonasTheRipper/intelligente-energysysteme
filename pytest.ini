[pytest]
# Marker taxonomy for the fast-unit / heavy-system CI split.
#   unit  -> fast, no grid load, no power flow (cma, postgis). Run on every push.
#   slow  -> loads the 5.9 MB SoCal grid and/or runs pandapower dispatch + a
#            power flow (damage mapper, palaestrAI env, MIDAS step). Run in the
#            automatic "system" CI stage, or locally.
markers =
    unit: fast unit tests (no grid load, no power flow)
    slow: heavy system tests (grid dispatch + power flow)
testpaths = tests
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
